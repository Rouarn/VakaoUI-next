name: 功能建议
description: 新组件、新能力或体验改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述使用场景，而不是直接给方案
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 新组件
        - 现有组件 API
        - 样式 / 主题
        - 文档 / 示例
        - 工程与发布
    validations:
      required: true
  - type: checkboxes
    id: breaking
    attributes:
      label: 兼容性
      options:
        - label: 这个建议可能需要破坏性变更
